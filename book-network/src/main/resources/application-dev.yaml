spring:
  datasource:
    url: jdbc:postgresql://ci-cd-bsn-db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOSTNAME}
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
        starttls:
          enable: true
    protocol: smtp

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 8640000

  mailing:
    frontend:
      activation-url: http://localhost:4200/activate-account

  cors:
    origins: http://localhost:4200,http://localhost:8080,http://192.168.0.227:8090,http://192.168.0.227:8080

  file:
    upload:
      photos-output-path: ./uploads