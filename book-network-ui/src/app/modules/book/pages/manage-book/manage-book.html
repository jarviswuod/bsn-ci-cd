<div class="container-fluid card login-container">
  <h3 class="text-center">Manage book</h3>
  <hr />
  @if (errorMsg().length > 0) {
    <div class="alert alert-danger" role="alert">
      @for (msg of errorMsg(); track msg) {
        <p class="p-0 m-0">{{ msg }}</p>
      }
    </div>
  }
  <div class="d-flex gap-2">
    <div class="col-3">
      <img
        class="rounded-1"
        width="100%"
        height="100%"
        [src]="selectedPicture() || 'https://picsum.photos/1900/800'"
        alt="..."
      />
      <div class="mt-2">
        <input
          (change)="onFileSelected($event)"
          class="form-control"
          type="file"
          id="formFile"
          accept="image/*"
        />
      </div>
    </div>
    <div class="col-9">
      <form class="row g-3">
        <div class="col-12">
          <label for="title" class="form-label">Title</label>
          <input
            [(ngModel)]="bookRequest.title"
            type="text"
            class="form-control"
            name="title"
            id="title"
            placeholder="Book title"
          />
        </div>
        <div class="col-6">
          <label for="author" class="form-label">Author Name</label>
          <input
            [(ngModel)]="bookRequest.authorName"
            type="text"
            class="form-control"
            name="author"
            id="author"
            placeholder="Author Name"
          />
        </div>
        <div class="col-6">
          <label for="isbn" class="form-label">ISBN</label>
          <input
            [(ngModel)]="bookRequest.isbn"
            type="text"
            class="form-control"
            name="isbn"
            id="isbn"
            placeholder="ISBN"
          />
        </div>
        <div class="col-12">
          <label for="synopsis" class="form-label">Synopsis</label>
          <textarea
            [(ngModel)]="bookRequest.synopsis"
            cols="30"
            rows="10"
            class="form-control"
            name="synopsis"
            id="synopsis"
            placeholder="Synopsis"
          ></textarea>
        </div>
        <div class="col-12">
          <input
            [(ngModel)]="bookRequest.shareable"
            class="form-check-input"
            type="checkbox"
            name="shareable"
            id="shareable"
          />
          <label for="shareable" class="form-check-input">Share me</label>
        </div>
        <div class="d-flex justify-content-end gap-2 col-12">
          <button (click)="saveBook()" type="submit" class="btn btn-outline-primary">
            <i class="fas fa-save"></i>&nbsp; Save
          </button>
          <a routerLink="/books/my-books" class="btn btn-link text-danger">
            <i class="fas fa-times"></i>&nbsp; Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
