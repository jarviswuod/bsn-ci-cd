<h3>Book list</h3>
@if (message()) {
  <div
    class="alert"
    [class.alert-success]="level() === 'success'"
    [class.alert-danger]="level() === 'error'"
    role="alert"
  >
    {{ message() }}
  </div>
}
<hr />
<div class="d-flex justify-content-sm-start gap-2 flex-wrap">
  @for (book of bookResponse().content ?? []; track book.id) {
    <app-book-card
      [book]="book"
      (borrow)="borrowBook($event)"
    >
      {{ book.title }}
    </app-book-card>
  }
</div>
<div class="d-flex justify-content-center mt-3">
  <nav aria-label="Page navigation example">
    <ul class="pagination">
      <li class="page-item">
        <a
          (click)="goToFirstPage()"
          class="page-link"
          href="javascript:void(0)"
          arial-label="First page"
          [class.disabled]="page == 0"
        >
          <i class="fa-solid fa-angles-left"></i>
        </a>
      </li>
      <li class="page-item">
        <a
          (click)="goToPreviousPage()"
          class="page-link"
          href="javascript:void(0)"
          arial-label="Previous"
          [class.disabled]="page == 0"
        >
          <i class="fa-solid fa-angle-left"></i>
        </a>
      </li>
      @for (_ of [].constructor(this.bookResponse().totalPages); track $index) {
        <li class="page-item">
          <a
            (click)="goToPage($index)"
            class="page-link"
            href="javascript:void(0)"
            [attr.aria-label]="'Page Number ' + ($index + 1)"
            [class.active]="page == $index"
          >
            {{ $index + 1 }}
          </a>
        </li>
      }
      <li class="page-item">
        <a
          (click)="goToNextPage()"
          class="page-link"
          href="javascript:void(0)"
          arial-label="Next"
          [class.disabled]="isLastPage"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </li>
      <li class="page-item">
        <a
          (click)="goToLastPage()"
          class="page-link"
          href="javascript:void(0)"
          arial-label="Last page"
          [class.disabled]="isLastPage"
        >
          <i class="fa-solid fa-angles-right"></i>
        </a>
      </li>
    </ul>
  </nav>
</div>
