services:
  postgres:
    container_name: ci-cd-bsn-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5440:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - spring-boot-network
    restart: unless-stopped

  mail-dev:
    container_name: ci-cd-mail-bsn
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - spring-boot-network
    restart: unless-stopped

  bsn-api:
    container_name: bsn-api
    image: bsn/bsn-api:1.0.0
    ports:
      - 8090:8080
    environment:
      ACTIVE_PROFILE: dev
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_URL: jdbc:postgresql://ci-cd-bsn-db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "curl", "-f", "http:bsn-api:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - spring-boot-network
    restart: unless-stopped

  bsn-ui:
    container_name: bsn-ui
    image: bsn/bsn-ui:1.0.0
    ports:
      - 4200:80
    depends_on:
      - bsn-api
    networks:
      - spring-boot-network
    restart: unless-stopped

volumes:
  postgres_volume:
    driver: local

networks:
  spring-boot-network:
    driver: bridge
